security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout

    role_hierarchy:
        ROLE_STAFF: ROLE_USER
        ROLE_GUIDANCE: ROLE_STAFF
        ROLE_DIRECTOR: ROLE_STAFF
        ROLE_VPSAS_SECRETARIAT: ROLE_STAFF
        ROLE_VPSAS: [ROLE_DIRECTOR, ROLE_GUIDANCE, ROLE_VPSAS_SECRETARIAT]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        - { path: ^/vpsas, roles: ROLE_VPSAS }
        - { path: ^/staff, roles: ROLE_STAFF }
        - { path: ^/care, roles: ROLE_GUIDANCE }
        - { path: ^/portal, roles: ROLE_STUDENT }
        - { path: ^/$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
